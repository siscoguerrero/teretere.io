<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Logotipo Teretere">
  <defs>
    <linearGradient id="bowlFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D167" />
      <stop offset="55%" stop-color="#E7B13E" />
      <stop offset="100%" stop-color="#C98827" />
    </linearGradient>
    <linearGradient id="bowlBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#342620" />
      <stop offset="100%" stop-color="#19120F" />
    </linearGradient>
  </defs>

  <!-- Outer calligraphic brush ring -->
  <path
    d="M 150 38
       C 122 20, 82 23, 56 48
       C 27 76, 24 126, 50 158
       C 76 190, 128 197, 162 170
       C 182 154, 193 130, 191 104"
    fill="none"
    stroke="#231D1A"
    stroke-width="4.5"
    stroke-linecap="round"
  />
  <path
    d="M 134 29
       C 103 21, 69 32, 48 58
       C 26 86, 26 128, 49 156"
    fill="none"
    stroke="#231D1A"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.7"
  />
  <path
    d="M 78 184
       C 111 196, 152 187, 175 159
       C 188 143, 194 123, 192 101"
    fill="none"
    stroke="#231D1A"
    stroke-width="1.6"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- Dark bowl (cazuela / totuma) -->
  <path
    d="M 60 124
       C 62 158, 84 176, 110 176
       C 136 176, 158 158, 160 124
       Z"
    fill="url(#bowlBody)"
  />
  <!-- Subtle highlight on bowl rim -->
  <ellipse cx="110" cy="124" rx="50" ry="11.5" fill="#2B1F1A" />

  <!-- Golden food filling inside the bowl -->
  <ellipse cx="110" cy="123" rx="46.5" ry="9.5" fill="url(#bowlFill)" />
  <path
    d="M 68 123 Q 110 111 152 123 Q 110 131 68 123 Z"
    fill="#F8D97B"
    opacity="0.65"
  />

  <!-- Organic food texture speckles -->
  <g fill="#7D431A" opacity="0.82">
    <circle cx="83" cy="123" r="1.8" />
    <circle cx="94" cy="120" r="1.5" />
    <circle cx="101" cy="125" r="2.0" />
    <circle cx="114" cy="119" r="1.4" />
    <circle cx="123" cy="124" r="1.9" />
    <circle cx="133" cy="120" r="1.6" />
    <circle cx="141" cy="123" r="1.5" />
    <circle cx="90" cy="126" r="1.3" />
    <circle cx="129" cy="126" r="1.4" />
  </g>
  <g fill="#A83A24" opacity="0.72">
    <circle cx="88" cy="121" r="1.2" />
    <circle cx="108" cy="126" r="1.3" />
    <circle cx="118" cy="121" r="1.2" />
    <circle cx="137" cy="122" r="1.1" />
  </g>
  <g fill="#FFF2B8" opacity="0.9">
    <circle cx="77" cy="122" r="1.1" />
    <circle cx="97" cy="122" r="1.2" />
    <circle cx="112" cy="123" r="1.3" />
    <circle cx="126" cy="121" r="1.1" />
  </g>

  <!-- Calligraphic 'T' descending into the bowl -->
  <path
    d="M 55 77
       C 74 68, 108 55, 144 55
       C 162 55, 174 58, 177 63
       C 179 66, 176 70, 172 71"
    fill="none"
    stroke="#231D1A"
    stroke-width="4.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 119 59
       C 115 74, 106 94, 96 113
       C 92 119, 89 123, 87 125"
    fill="none"
    stroke="#231D1A"
    stroke-width="4.2"
    stroke-linecap="round"
  />
  <!-- Delicate taper at stem tip -->
  <path
    d="M 118 61 C 113 77, 104 97, 94 115"
    fill="none"
    stroke="#231D1A"
    stroke-width="2.2"
    stroke-linecap="round"
  />
</svg>
